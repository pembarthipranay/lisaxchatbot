<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>LISAX</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(90% 60% at 15% 100%, rgba(255, 90, 60, 0.5) 0%, rgba(255, 90, 60, 0) 55%),
      radial-gradient(90% 70% at 100% 0%, rgba(120, 40, 60, 0.5) 0%, rgba(120, 40, 60, 0) 50%),
      linear-gradient(160deg, #2a1420 0%, #201018 45%, #1b0f16 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Everything lives inside a centered column so it reads well at any
     window width, but the gradient itself always fills the whole page. */
  .app-shell {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    min-height: 0;
  }

  .header {
    text-align: center;
    padding: clamp(28px, 6vh, 56px) 24px 20px;
    flex-shrink: 0;
  }

  .header .greeting {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(16px, 2.2vw, 22px);
    color: #e7d9d6;
    margin: 0 0 6px;
  }

  .header .brand {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 56px);
    letter-spacing: clamp(3px, 1vw, 7px);
    color: #f2e6e2;
    margin: 0 0 8px;
  }

  .header .tagline {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 22px);
    color: #e7d9d6;
    margin: 0;
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px clamp(16px, 4vw, 32px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .empty-hint {
    margin: auto;
    color: rgba(230, 215, 212, 0.65);
    font-size: 15px;
    text-align: center;
  }

  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: rgba(255, 255, 255, 0.14);
    color: #f5ece9;
    border-bottom-right-radius: 6px;
  }

  .msg.bot {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.07);
    color: #efe1de;
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom-left-radius: 6px;
  }

  .msg.bot.typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px 18px;
  }

  .msg.bot.typing span {
    width: 6px;
    height: 6px;
    background: rgba(240, 225, 222, 0.7);
    border-radius: 50%;
    animation: blink 1.2s infinite ease-in-out;
  }
  .msg.bot.typing span:nth-child(2) { animation-delay: 0.2s; }
  .msg.bot.typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  .input-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px clamp(16px, 4vw, 32px) calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .input-bar input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    padding: 16px 20px;
    border-radius: 999px;
    font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
    background: rgba(230, 218, 216, 0.85);
    color: #241318;
  }

  .input-bar input::placeholder {
    color: #6b5257;
  }

  .send-btn {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: #241016;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .send-btn:hover { transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  .send-btn svg {
    width: 20px;
    height: 20px;
    fill: #f2e6e2;
  }

  .error-banner {
    margin: 0 clamp(16px, 4vw, 32px) 10px;
    padding: 10px 14px;
    background: rgba(255, 80, 80, 0.15);
    border: 1px solid rgba(255, 80, 80, 0.3);
    color: #ffd6d6;
    border-radius: 12px;
    font-size: 13px;
    text-align: center;
  }

  /* ---------- Responsive breakpoints ---------- */

  /* Phones */
  @media (max-width: 480px) {
    .header { padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 14px; }
    .msg { max-width: 86%; font-size: 14px; }
    .send-btn { width: 48px; height: 48px; }
  }

  /* Very small phones */
  @media (max-width: 340px) {
    .header .brand { letter-spacing: 2px; }
    .input-bar input { padding: 14px 16px; }
  }

  /* Short windows (landscape phones, small laptop windows) */
  @media (max-height: 650px) {
    .header { padding-top: 20px; padding-bottom: 10px; }
    .header .brand { font-size: clamp(26px, 5vw, 36px); margin-bottom: 4px; }
    .header .greeting, .header .tagline { font-size: 14px; }
  }

  /* Wide desktop windows: give the chat column a bit more breathing room */
  @media (min-width: 1400px) {
    .app-shell { max-width: 820px; }
  }
</style>
</head>
<body>

  <div class="app-shell">
    <div class="header">
      <p class="greeting">Hey, I'm</p>
      <h1 class="brand">LISAX</h1>
      <p class="tagline">Let's talk!</p>
    </div>

    <div id="chatArea" class="chat-area">
      <p class="empty-hint" id="emptyHint">Ask me anything to get started.</p>
    </div>

    <div id="errorBanner" class="error-banner" style="display:none;"></div>

    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Ask Anything" autocomplete="off" />
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>

<script>
  const chatArea = document.getElementById('chatArea');
  const emptyHint = document.getElementById('emptyHint');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const errorBanner = document.getElementById('errorBanner');

  let history = []; // [{role, content}, ...]

  function addMessage(role, text) {
    if (emptyHint) emptyHint.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    setTimeout(() => { errorBanner.style.display = 'none'; }, 4000);
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    userInput.value = '';
    sendBtn.disabled = true;

    const typingEl = addTypingIndicator();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) })
      });

      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        showError(data.error || 'Something went wrong.');
        return;
      }

      addMessage('bot', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      typingEl.remove();
      showError('Could not reach the server.');
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
